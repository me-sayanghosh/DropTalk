<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222630" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#0E1015"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)" opacity="0.5"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#252A36" stroke-width="4"/>

  <!-- Bauhaus Diagonal Constructivist Axis -->
  <line x1="60" y1="452" x2="452" y2="60" stroke="#2E3444" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 1. Deep Bauhaus Blue Square -->
  <g filter="drop-shadow(8px 8px 0px #000000)">
    <rect x="220" y="130" width="190" height="190" fill="#1040C0" stroke="#121212" stroke-width="8"/>
  </g>

  <!-- 2. Primary Bauhaus Red Circle -->
  <g filter="drop-shadow(8px 8px 0px #000000)">
    <circle cx="185" cy="275" r="105" fill="#D02020" stroke="#121212" stroke-width="8"/>
  </g>

  <!-- 3. Bauhaus Amber Yellow Dynamic Triangle -->
  <g filter="drop-shadow(8px 8px 0px #000000)">
    <polygon points="260,105 385,395 180,360" fill="#F0C020" stroke="#121212" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
